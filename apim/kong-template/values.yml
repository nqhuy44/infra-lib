upstreams:
  - name: my-upstream
    targets:
      - target: 10.0.0.1:8080
        weight: 100
      - target: 10.0.0.2:8080
        weight: 50
    healthchecks:
      active:
        http_path: /status
        healthy:
          interval: 5
          successes: 1
        unhealthy:
          interval: 5
          http_failures: 3

services:
  - name: my-service
    url: http://my-upstream
    tags:
      - public
      - v1
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true

routes:
  - name: my-route
    service: my-service
    hosts:
      - example.com
    paths:
      - /api
    plugins:
      - name: rate-limiting
        config:
          minute: 20
          policy: local

plugins:
  - name: request-size-limiting
    config:
      allowed_payload_size: 128
    attach:
      services:
        - my-service
      serviceTags:
        - public

consumers:
  - username: alice
    keyauth_credentials:
      - key: alice-key-123
    acls:
      - group: admins
  - username: bob
    keyauth_credentials:
      - key: bob-key-456
    acls:
      - group: users