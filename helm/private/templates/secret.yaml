{{- if and (.Values.externalEnvFromAWS.enabled) }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ template "secretName" $ }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
spec:
  provider: {{ .Values.externalEnvFromAWS.provider | default "aws" }}
  parameters:
    objects: |
      - objectName: "{{ .Values.externalEnvFromAWS.secretName }}"
        objectType: "secretsmanager"
        jmesPath:
          {{- range .Values.externalEnvFromAWS.keys }}
          - path: {{ . }}
            objectAlias: {{ . }}
          {{- end }}
    renewTime: {{ .Values.externalEnvFromAWS.renewTime }}
  secretObjects:
    - secretName: {{ template "secretName" $ }}
      type: Opaque
      data:
        {{- range .Values.externalEnvFromAWS.keys }}
        - key: {{ . }}
          objectName: {{ . }}
        {{- end }}
{{- end }}
---

{{- if and (.Values.externalEnvFromVault.enabled) (not .Values.externalEnvFromAWS.enabled) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ template "secretName" $ }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
spec:
  refreshInterval: {{ .Values.externalEnvFromVault.interval }}
  secretStoreRef:
    name: {{ .Values.externalEnvFromVault.secretStoreRef.name }}
    kind: SecretStore
  target:
    name: {{ template "secretName" $ }}
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: {{ .Values.externalEnvFromVault.key | quote }}
{{- end }}
---
{{- if and (.Values.externalEnvFromAWS.enabled) (.Values.externalEnvFromAWS.mountAsFiles) }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ template "secretNameFiles" $ }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
spec:
  provider: {{ .Values.externalEnvFromAWS.provider | default "aws" }}
  parameters:
    objects: |
      - objectName: "{{ .Values.externalEnvFromAWS.secretName }}"
        objectType: "secretsmanager"
        {{- if .Values.externalEnvFromAWS.fileKeys }}
        jmesPath:
          {{- range .Values.externalEnvFromAWS.fileKeys }}
          - path: {{ .key }}
            objectAlias: {{ .filename | default .key }}
          {{- end }}
        {{- else if .Values.externalEnvFromAWS.keys }}
        jmesPath:
          {{- range .Values.externalEnvFromAWS.keys }}
          - path: {{ . }}
            objectAlias: {{ . }}
          {{- end }}
        {{- end }}
    renewTime: {{ .Values.externalEnvFromAWS.renewTime | default "1h" }}
{{- end }}