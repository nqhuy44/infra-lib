{{- if .Values.enabledDeployment }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ template "chart.fullname" $ }}-ingress"
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    {{- if .Values.ingress.enabled }}
    {{- range $i :=.Values.ingress.hostname }}
    - host: {{ $i.host }}
      http:
        paths:
        {{- range $i.paths }}
          - backend:
              service:
                name: {{ template "chart.fullname" $ }}
                port:
                  number: {{ template "serviceport" $  }}
            path: {{ . }}
            pathType: {{ $i.pathType | default "ImplementationSpecific" }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}

