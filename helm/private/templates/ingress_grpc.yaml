{{- if .Values.enabledDeployment }}
{{- if .Values.grpcIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ template "chart.fullname" $ }}-grpc-ingress"
  {{- with .Values.grpcIngress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.grpcIngress.className }}
  ingressClassName: {{ .Values.grpcIngress.className | quote }}
  {{- end }}
  {{- if .Values.grpcIngress.tls.enabled }}
  tls:
    - hosts:
        {{- if kindIs "string" .Values.grpcIngress.hostname }}
        - {{ .Values.grpcIngress.hostname | quote }}
        {{- else }}
        {{- range .Values.grpcIngress.hostname }}
        - {{ .host | quote }}
        {{- end }}
        {{- end }}
      secretName: {{ .Values.grpcIngress.tls.secretName | quote }}
  {{- end }}
  rules:
    # {{- if kindIs "string" .Values.grpcIngress.hostname }}
    # - host: {{ .Values.grpcIngress.hostname | quote }}
    #   http:
    #     paths:
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             {{- if .Values.grpcIngress.serviceName }}
    #             name: {{ .Values.grpcIngress.serviceName | quote }}
    #             {{- else }}
    #             name: "{{ template "chart.fullname" $ }}-headless"
    #             {{- end }}
    #             port:
    #               number: {{ .Values.grpcIngress.servicePort }}
    # {{- else }}
    {{- range $i := .Values.grpcIngress.hostname }}
    - host: {{ $i.host }}
      http:
        paths:
        {{- range $i.paths }}
        - backend:
            service:
              {{- if $.Values.grpcIngress.serviceName }}
              name: {{ $.Values.grpcIngress.serviceName | quote }}
              {{- else }}
              name: "{{ template "chart.fullname" $ }}-headless"
              {{- end }}
              port:
                number: {{ $.Values.grpcIngress.servicePort }}
          path: {{ . }}
          pathType: {{ $i.pathType | default "Prefix" }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
