{{- if and .Values.pdb .Values.pdb.enabled }}
{{- /* Prefer policy/v1 if supported (K8s >=1.21), fall back to v1beta1 otherwise */ -}}
apiVersion: {{- if $.Capabilities.APIVersions.Has "policy/v1/PodDisruptionBudget" }} policy/v1 {{- else }} policy/v1beta1 {{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ template "chart.fullname" $ }}
  labels:
    app: {{ .Values.name }}
    tier: {{ .Values.tier }}
spec:
  {{- if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- else if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
      tier: {{ .Values.tier }}
{{- end }}
