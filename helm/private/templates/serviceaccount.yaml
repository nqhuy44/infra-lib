{{- if .Values.serviceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "saName" $ }}
  labels:
    app: {{ .Values.name }}
    tier: {{ .Values.tier }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.role }}
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/resource-policy": keep
{{- end }}
