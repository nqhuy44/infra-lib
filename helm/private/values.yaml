name: test-api-service
tier: application
replicas: 1
image:
  registry: docker.io
  repository: library/alpine
  tag: latest
  pullPolicy: Always
  containerPort: 80
  imagePullSecrets: []
  command: "while true; do sleep 36000; done"

annotations: {}

reloader:
  enabled: false
  mode: specific
  configmap:
    enabled: true
  secret:
    enabled: false

fullnameOverride: ""

serviceAccount:
  enabled: false
  role: arn:aws:iam::123456789:role/dev-sa

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

livenessProbe: {}
  # httpGet:
  #   path: /
  #   port: 80
  # initialDelaySeconds: 15
  # periodSeconds: 20
  # timeoutSeconds: 3
  # failureThreshold: 6

readinessProbe: {}
  # httpGet:
  #   path: /
  #   port: 80
  # initialDelaySeconds: 15
  # periodSeconds: 20
  # timeoutSeconds: 3
  # failureThreshold: 6

startupProbe: {}
  # httpGet:
  #   path: /
  #   port: 80
  # initialDelaySeconds: 30
  # periodSeconds: 20
  # timeoutSeconds: 3
  # failureThreshold: 6

# # terminationGracePeriodSeconds should be greater than to the total:
# # sleep (5s) in preStop + keepalive_timeout (65s) in nginx.
# terminationGracePeriodSeconds: 80

resources:
  limits:
    cpu: "0.5"
    memory: 1Gi
  requests:
    cpu: "100m"
    memory: 200Mi

lifecycle: {}
  # postStart:
  #   # Introduce a how to init pods before to be ready say hi with traffic income
  #   exec:
  #     command: ["/bin/sh", "-c", "rsync -av /app/ /var/www/app/"]
  # preStop:
  #   # Introduce a delay to the shutdown sequence to wait for the
  #   # pod eviction event to propagate. Then, gracefully shutdown
  #   # nginx.
  #   exec:
  #     command: ["sh", "-c", "sleep 5 && /usr/sbin/nginx -s quit"]

## Pod scheduling preferences (by default keep pods within a release on separate nodes).
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## By default we don't set affinity
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-type
              operator: In
              values:
                - workloads
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: node-type
              operator: In
              values:
                - system
        topologyKey: "kubernetes.io/hostname"
## Tolerations are applied to pods, and allow (but do not require) the pods to schedule onto nodes with matching taints.
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: {}
# - key: "dedicated"
#   operator: "Equal"
#   value: "lowPriority"
#   effect: "NoSchedule"
nodeSelector: {}
#  disktype: ssd
#  environment: production
mounts: []
#   - name: nginx-config
#     mountPath: /etc/nginx/site-enable/default.conf
#     filename: server.conf

serverBlock: {}

# Enable autoscaling HPA for the pods, currently this using apiVersion autoscaling/v2beta2
# Notes: auto-scaling only take affect when above "resources" are specified
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 15
  # specify target CPU % utilization
  targetCPUUtilizationPercentage: 85
  # specify target CPU average value
  # specify target Memory % utilization
  targetMemoryUtilizationPercentage: 85
  # specify target Memory average value

service:
  ## Service type
  ##
  type: ClusterIP

  ## HTTP Port
  ##
  port: 80

  ## gRPC Port configuration
  ##
  grpc:
    enabled: false
    port: 9000
    targetPort: 9000

  ## Specify the nodePort(s) value(s) for the LoadBalancer and NodePort service types.
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport
  ##
  # nodePorts:
  #   http: 32735

  externalTrafficPolicy: ""

ingress:
  ## Set to true to enable ingress record generation
  ##
  enabled: false
  ## Set this to true in order to add the corresponding annotations for cert-manager
  ##
  className: "nginx-ingress-controller"
  hostname:
    # - host: dev-api.com
    #   paths:
    #     - /healthcheck
    #     - /api/v1.0/users/settings
    #   pathType: "ImplementationSpecific"
    - host: dev.com
      paths:
        - /api/v1.0/auth/change-password
      pathType: "Prefix"
  annotations: {}
    # ingressclass.kubernetes.io/is-default-class: "true"

# gRPC Ingress configuration
grpcIngress:
  ## Set to true to enable gRPC ingress record generation
  ##
  enabled: false
  ## Ingress Class Name
  ##
  className: "nginx-ingress-controller"
  ## gRPC hostname configuration
  ## Can be a single hostname string or a list of hosts with paths
  ##
  # hostname: []
  # Single hostname (simple):
  # hostname: "grpc.example.com"
  # Multiple hosts with paths (advanced):
  hostname:
    - host: grpc.example.com
      paths:
        - /exmaple.com/v1
      pathType: "Prefix"
  ## gRPC service port
  ##
  servicePort: 9000
  ## Service name override (if different from main service)
  ##
  serviceName: ""
  ## TLS configuration
  ##
  tls:
    enabled: false
    secretName: ""
  ## gRPC specific annotations
  ##
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

enabledDeployment: true

cronjobs: {}

workers: {}

preInstalls: {}

hostAliases: {}

# Handle emptyDir volumes for the pod
# ref: https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
# emptyDirVolumes:
#   - name: tmp-volume
#     mountPath: /tmp
#     readOnly: false
emptyDirVolumes: {}

externalEnvFromCM:
  enabled: false
  type: variable
  # type: file
  # fileName: ".env"
  mountPath: ""
  readOnly: false
  data:
    DEFAULT_OTP: "false"
    TZ: "UTC"

# enable external data from secret
externalData: {}

# enable external env from both configmap and secret, env from secret will overwrite env from configmap
externalEnvFromVault:
  enabled: false
  interval: "1m"
  secretStoreRef:
    name: vault-backend
  key: "prod/data/auth/env"

externalEnvFromAWS:
  enabled: true
  renewTime: 1m
  secretName: "dev/service/secrets"
  # For environment variables (old config)
  keys:
    - hello
  # For file mounting (new config)
  mountAsFiles: false
  mountPath: "/mnt/secrets"
  fileKeys:
    - key: '"\"config.json\""'
      filename: config.json

# persistentVolumes:
#   - name: data-pvc
#     mountPath: /data
#     existingClaim: my-existing-pvc
#   - name: logs-pvc
#     mountPath: /logs

envs:
  APP_NAME: "API"
  TZ: "UTC"
  NODE_ENV: "development"

podLabels: {}

# Pod Disruption Budget configuration
# Disable by default. Enable to protect against voluntary disruptions
# by ensuring a minimum number of pods remain available.
# One of minAvailable or maxUnavailable may be set. If neither is set,
# the chart will default to minAvailable: 1.
# See: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
